name: cms-zarya

services:
  app:
    image: ${ZARYA_APP_IMAGE:-cms-zarya-app}:${ZARYA_CMS_VERSION:?Run node scripts/prepare-compose.mjs}
    build: .
    command: [sh, -c, 'node scripts/wait-resource-helper.mjs && exec node dist/public-http.js']
    restart: unless-stopped
    init: true
    mem_limit: ${ZARYA_CMS_MEMORY_LIMIT:-6144m}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      ZARYA_MONGO_URI: ${ZARYA_MONGO_URI:?Set ZARYA_MONGO_URI}
      ZARYA_MONGO_DATABASE: ${ZARYA_MONGO_DATABASE:?Set ZARYA_MONGO_DATABASE}
      ZARYA_LOCAL_OPERATOR_ID: ${ZARYA_LOCAL_OPERATOR_ID:?Set ZARYA_LOCAL_OPERATOR_ID}
      ZARYA_LOCAL_ADMINISTRATOR: 'true'
      ZARYA_SITES_ROOT: /app/sites
      ZARYA_ARTIFACTS_ROOT: /app/artifacts
      ZARYA_DUMPS_ROOT: /app/dumps
      ZARYA_MEDIA_ROOT: /app/data
      ZARYA_MEDIA_PUBLIC_PATH: /assets
      ZARYA_HTTP_HOST: 0.0.0.0
      ZARYA_HTTP_PORT: '3000'
      ZARYA_ADMIN_AUTH_ORIGIN: ${ZARYA_ADMIN_AUTH_ORIGIN:?Set ZARYA_ADMIN_AUTH_ORIGIN}
      ZARYA_ADMIN_ROOT: /app/admin/dist
      ZARYA_DATABASE_PLACEMENT: ManagedLocal
      ZARYA_MONGO_MAX_POOL_SIZE: ${ZARYA_MONGO_MAX_POOL_SIZE:-5}
      ZARYA_INSTALLATION_CPU_BUDGET: ${ZARYA_INSTALLATION_CPU_BUDGET:?Prepare installation CPU capacity}
      ZARYA_INFRASTRUCTURE_CPU_RESERVE: ${ZARYA_INFRASTRUCTURE_CPU_RESERVE:-0}
      ZARYA_RESOURCE_SOCKET: /run/zarya/resources.sock
      ZARYA_RESOURCE_SECRET_FILE: /run/secrets/resource-control-key
      ZARYA_UPSTREAM_HOST: ${ZARYA_UPSTREAM_HOST:?Set ZARYA_UPSTREAM_HOST}
      ZARYA_EDGE_PROXY_SECRET: ${ZARYA_EDGE_PROXY_SECRET:?Set ZARYA_EDGE_PROXY_SECRET}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./artifacts/production:/app/artifacts
      - ./data:/app/data
      - ./sites:/app/sites
      - ./dumps/production:/app/dumps
      - resource-control:/run/zarya
      - ./.secrets/resources/key:/run/secrets/resource-control-key:ro
    networks: [database, web]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'require("node:http").get({hostname: "127.0.0.1", port: 3000, path: "/api/health", headers: {Host: process.env.ZARYA_UPSTREAM_HOST}}, r => {r.resume(); process.exit(r.statusCode === 200 ? 0 : 1)}).on("error", () => process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  resource-control:
    image: ${ZARYA_APP_IMAGE:-cms-zarya-app}:${ZARYA_CMS_VERSION:?Run node scripts/prepare-compose.mjs}
    user: '0:0'
    command: [node, dist/resource-helper.js]
    restart: unless-stopped
    init: true
    read_only: true
    network_mode: service:app
    mem_limit: 128m
    environment:
      ZARYA_RESOURCE_SOCKET: /run/zarya/resources.sock
      ZARYA_RESOURCE_SECRET_FILE: /deployment/key
      ZARYA_RESOURCE_OVERRIDE_FILE: /deployment/compose.json
      ZARYA_RESOURCE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-cms-zarya}
      ZARYA_INSTALLATION_CPU_BUDGET: ${ZARYA_INSTALLATION_CPU_BUDGET:?Prepare installation CPU capacity}
      ZARYA_INFRASTRUCTURE_CPU_RESERVE: ${ZARYA_INFRASTRUCTURE_CPU_RESERVE:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - resource-control:/run/zarya
      - ./.secrets/resources:/deployment

  cloudflare:
    profiles: [cloudflare]
    image: ${ZARYA_EXECUTOR_IMAGE:-cms-zarya-cloudflare}:${ZARYA_CMS_VERSION:?Run node scripts/prepare-compose.mjs}
    build:
      context: .
      target: cloudflare
    init: true
    mem_limit: 1536m
    command: [node, /app/dist/deployment-executor.js]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=768
      ZARYA_MONGO_URI: ${ZARYA_MONGO_URI:?Set ZARYA_MONGO_URI}
      ZARYA_MONGO_DATABASE: ${ZARYA_MONGO_DATABASE:?Set ZARYA_MONGO_DATABASE}
      ZARYA_LOCAL_OPERATOR_ID: ${ZARYA_LOCAL_OPERATOR_ID:?Set ZARYA_LOCAL_OPERATOR_ID}
      ZARYA_LOCAL_ADMINISTRATOR: 'true'
      ZARYA_SITES_ROOT: /app/sites
      ZARYA_ARTIFACTS_ROOT: /app/artifacts
      ZARYA_DUMPS_ROOT: /app/dumps
      ZARYA_MEDIA_ROOT: /app/data
      ZARYA_MEDIA_PUBLIC_PATH: /assets
      ZARYA_EDGE_PROXY_SECRET: ${ZARYA_EDGE_PROXY_SECRET:?Set ZARYA_EDGE_PROXY_SECRET}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      WRANGLER_SEND_METRICS: 'false'
      ZARYA_DEPLOYMENT_ROOT: /work/targets
    volumes:
      - ./artifacts/production:/app/artifacts:ro
      - ./data:/app/data:ro
      - ./sites:/app/sites:ro
      - ./dumps/production:/app/dumps:ro
      - ./dumps/production/.coordination:/app/dumps/.coordination
      - ./.cloudflare:/work
      - ./cloudflare.json:/work/cloudflare.json:ro
      - ./migrations:/work/migrations:ro
    networks: [database, web]
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:9.0.8@sha256:1444adda2e4b8d6a0d7f242a625d834a78d6e3aa6e4ed1b0b4c2dab2318c5e3d
    command: [mongod, --replSet, zarya-rs, --bind_ip_all, --keyFile, /run/secrets/mongo-keyfile, --wiredTigerCacheSizeGB, '0.5']
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      MONGO_INITDB_ROOT_USERNAME: zarya_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_APP_DATABASE: ${ZARYA_MONGO_DATABASE:?Set ZARYA_MONGO_DATABASE}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./.secrets/mongo-keyfile:/run/secrets/mongo-keyfile:ro
      - ./ops/mongo-init.js:/docker-entrypoint-initdb.d/10-zarya-app.js:ro
    networks: [database]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          const admin = db.getSiblingDB('admin');
          if (!admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1);
          try { if (!db.hello().isWritablePrimary) { try { rs.status() } catch {
          rs.initiate({_id:'zarya-rs',members:[{_id:0,host:'mongo:27017'}]}) }
          quit(1) } } catch { quit(1) }
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  proxy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    environment:
      ZARYA_BACKEND_HOST: ${ZARYA_BACKEND_HOST:?Set ZARYA_BACKEND_HOST}
      ZARYA_UPSTREAM_HOST: ${ZARYA_UPSTREAM_HOST:?Set ZARYA_UPSTREAM_HOST}
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  database:
    internal: true
  web:

volumes:
  resource-control:
  mongo-data:
  caddy-data:
  caddy-config:
